name: SQL Linting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sql-lint:
    name: SQL Lint (SQLFluff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SQLFluff
        run: |
          python -m pip install --upgrade pip
          pip install sqlfluff

      - name: Lint SQL files
        run: |
          # Only run lint if there are sql files to prevent action failure
          if [ $(find . -name "*.sql" | wc -l) -gt 0 ]; then
            sqlfluff lint --dialect tsql Day_*/src/*.sql
          else
            echo "No SQL files found to lint."
          fi
